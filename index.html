<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>アンダー100</title><link rel="stylesheet" href="style.css?v=white-commands-2"></head>
<body><main><header><a class="brand" href="./">✦ アンダー100</a><button id="sound" aria-label="効果音を切り替え">♪ 音 OFF</button></header>
<div class="game"><section class="panel journey"><div class="scene-head"><strong id="location">地上0階 · 門前都市</strong><span id="phase">探索</span></div><div class="journey-meta"><span>歩数 <span id="steps">0</span></span><span id="enemyStatus">周囲を探索して冒険を進めよう。</span></div></section>
<aside class="panel hero"><div class="panel-title">旅の仲間 <span>01</span></div><div class="identity"><div class="avatar">⚔</div><div><h2>アステル <span id="level">Lv. 1</span></h2><p>地下を目指す冒険者</p></div></div><div class="stat"><label>HP <b id="hpText"></b></label><div class="bar"><i id="hpBar"></i></div></div><div class="stat mana"><label>MP <b id="mpText"></b></label><div class="bar"><i id="mpBar"></i></div></div><div class="details"><span>こうげき <b id="atk"></b></span><span>ぼうぎょ <b id="def"></b></span><span>所持金 <b id="gold"></b></span><span>薬草 <b id="herbs"></b></span></div><div class="exp"><label>次のレベルまで <span id="expText"></span></label><div class="bar"><i id="expBar"></i></div></div><div class="quest"><span>✧ MAIN QUEST</span><p id="questText">都市で準備し、地下100階を目指そう。</p></div></aside>
<section class="panel dialogue"><div class="panel-title">冒険の記録</div><div id="log" role="log" aria-live="polite"></div></section><section class="panel commands"><div class="panel-title">どうする？ <span id="commandHint">コマンドを選択</span></div><div id="commands"></div></section></div><footer><span>選択で紡ぐ、小さな冒険。</span><div><button id="save">旅を記録</button><button id="load">記録から再開</button><button id="reset">はじめから</button></div><span>キーボード 1–6 で選択</span></footer></main><script src="game.js"></script></body></html>
